name: Android debug
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional prerelease version, e.g. v0.1.0-alpha.1'
        required: false
        default: ''
        type: string
      allow_runner_kvm_acl:
        description: 'One-run approval required: grant this temporary runner user KVM access'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npm run vendor && git diff --exit-code -- app/src/main/assets/vendor && npm test
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/browser-smoke.cjs && node scripts/test-voice-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InkDock-browser-screenshots
          path: build/screenshots/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Locate Android SDK tools
        shell: bash
        run: |
          # GitHub images may provide an SDK without sdkmanager on PATH.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then SDK_ROOT="$RUNNER_TEMP/android-sdk"; fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            # Official Google package; pin and verify the published SHA-256.
            ARCHIVE="$RUNNER_TEMP/android-commandlinetools.zip"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip --output "$ARCHIVE"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ARCHIVE" | sha256sum --check --strict
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/android-commandlinetools"
            mv "$RUNNER_TEMP/android-commandlinetools/cmdline-tools" "$SDK_ROOT/cmdline-tools/15859902"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/15859902/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android platform
        # Use runner's existing SDK licenses; do not silently accept new terms.
        run: sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' </dev/null
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Grant explicitly approved one-run KVM access
        if: github.event_name == 'workflow_dispatch' && inputs.allow_runner_kvm_acl == true
        shell: bash
        run: |
          # Requires fresh approval for this run; never widen access for all users.
          test -c /dev/kvm
          command -v setfacl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Check existing emulator acceleration access
        run: |
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::Android 15 regression blocked: runner lacks existing read/write access to /dev/kvm. Device permissions were not changed.'
            exit 1
          fi
      - name: Run Android 15 platform Back regression
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p build/android-regression
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/inkdock-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # "no" declines custom hardware configuration; SDK license terms are not accepted here.
          printf 'no\n' | avdmanager create avd --force --name inkdock-api35 --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/inkdock-api35.avd"
          test -f "$ANDROID_AVD_HOME/inkdock-api35.ini"
          emulator -list-avds | tee build/android-regression/avd-list.txt
          grep -Fx inkdock-api35 build/android-regression/avd-list.txt
          emulator -avd inkdock-api35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > build/android-regression/emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'timeout 10 adb logcat -d > build/android-regression/logcat.txt 2>&1 || true; timeout 10 adb shell dumpsys activity activities > build/android-regression/activities.txt 2>&1 || true; timeout 10 adb emu kill || true; kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          BOOTED=false
          for attempt in $(seq 1 150); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat build/android-regression/emulator.log
              echo '::error::Emulator exited before boot.'
              exit 1
            fi
            if [[ "$(timeout 3 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              BOOTED=true
              break
            fi
            sleep 2
          done
          [[ "$BOOTED" == true ]] || { cat build/android-regression/emulator.log; echo '::error::Emulator boot timed out.'; exit 1; }
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | tee build/android-regression/api-level.txt
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 35
          adb logcat -c
          gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace 2>&1 | tee build/android-regression/instrumentation-gradle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InkDock-Android15-regression
          path: |
            build/android-regression/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: InkDock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InkDock-debug-apk
          path: release
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || { echo 'Invalid preview version'; exit 1; }
          mv release/app-debug.apk release/InkDock-debug.apk
          (cd release && sha256sum InkDock-debug.apk > SHA256SUMS.txt)
          gh release create "$VERSION" release/InkDock-debug.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "InkDock $VERSION" --notes-file docs/release-notes.md
